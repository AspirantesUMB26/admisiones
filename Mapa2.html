<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Mapa UMB - Unidades de Estudios Superiores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-burgundy: #8B2332;
      --primary-light: #9D2449;
      --primary-gold: #D4AF37;
      --bg-soft: #f5f7fa;
      --bg-card: #ffffff;
      --border: #e7e7e7;
      --text-dark: #2c3e50;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
      --shadow-hard: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-soft);
      color: var(--text-dark);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pleca-gobierno {
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, var(--primary-burgundy) 0%, var(--primary-light) 60%, var(--primary-gold) 100%);
      position: sticky;
      top: 0;
      left: 0;
      z-index: 30;
    }

    .page-header {
      width: 100%;
      padding: 22px 20px 10px;
      text-align: center;
    }

    #mapa-titulo {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      color: var(--primary-burgundy);
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    #mapa-titulo::after {
      content: '';
      display: block;
      width: 88px;
      height: 4px;
      background: var(--primary-gold);
      border-radius: 2px;
      margin: 12px auto 0;
    }

    #mapa-container {
      width: min(95%, 1500px);
      display: flex;
      background: var(--bg-card);
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      border-top: 4px solid var(--primary-gold);
      overflow: hidden;
      margin: 10px 10px 40px;
      min-height: 620px;
    }

    #planteles-panel {
      width: 320px;
      flex-shrink: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    .planteles-header {
      background: var(--primary-burgundy);
      color: white;
      padding: 22px 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
    }

    #planteles-busca {
      width: calc(100% - 32px);
      margin: 16px auto 8px;
      padding: 12px 16px;
      border: 1px solid #e4e4e4;
      border-radius: 999px;
      background: #f9f9f9;
      outline: none;
      font: inherit;
    }

    #planteles-busca:focus {
      border-color: var(--primary-gold);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    #planteles-lista {
      list-style: none;
      padding: 10px 0 18px;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }

    .plantel-item {
      padding: 14px 18px;
      cursor: pointer;
      border-left: 4px solid transparent;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text-dark);
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .plantel-item:hover,
    .plantel-item.active {
      background: #fffaf0;
      color: var(--primary-burgundy);
      border-left-color: var(--primary-burgundy);
    }

    #mapa-svg-wrapper {
      position: relative;
      flex: 1;
      min-height: 620px;
      background: radial-gradient(circle at center, #ffffff 0%, #edf1f5 100%);
      overflow: hidden;
    }

    .map-instruction {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.85rem;
      color: #666;
      z-index: 15;
      pointer-events: none;
      white-space: nowrap;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.1s ease-out;
    }

    .map-region {
      fill: #f0f2f5;
      stroke: white;
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .map-region:hover,
    .map-region.active {
      fill: #d4af37;
      opacity: 0.9;
    }

    .map-region.has-carreras {
      fill: #ffffff;
      stroke: var(--primary-burgundy);
    }

    .tooltip {
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(255,255,255,0.97);
      color: var(--primary-burgundy);
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 8px;
      box-shadow: var(--shadow-hard);
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      pointer-events: none;
      display: none;
      white-space: nowrap;
      transform: translate(12px, 12px);
      z-index: 20;
    }

    .zoom-controls {
      position: absolute;
      left: 22px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 15;
    }

    .zoom-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      box-shadow: var(--shadow-hard);
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-dark);
    }

    .zoom-btn:hover {
      background: var(--primary-gold);
      color: white;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 24, 32, 0.62);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      width: min(90vw, 780px);
      max-height: 85vh;
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      border-top: 5px solid var(--primary-burgundy);
      position: relative;
    }

    .modal-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-burgundy), var(--primary-light));
      color: white;
      padding: 28px 28px 20px;
      overflow: hidden;
    }

    .modal-header::after {
      content: '';
      position: absolute;
      top: -40px;
      right: -30px;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .close-btn {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.7rem;
      cursor: pointer;
      z-index: 2;
    }

    .modal-header h2 {
      margin: 0;
      position: relative;
      z-index: 1;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.5rem, 2vw, 2.2rem);
    }

    .modal-subtitle {
      position: relative;
      z-index: 1;
      color: rgba(255,255,255,0.85);
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .modal-body {
      padding: 26px 28px 30px;
    }

    .carrera-seccion {
      margin-bottom: 26px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .carrera-seccion:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .carrera-subtitulo {
      color: var(--primary-burgundy);
      font-family: 'Montserrat', sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .carrera-texto {
      margin: 0;
      line-height: 1.7;
      color: #555;
    }

    .lista-carreras {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .lista-carreras li {
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #eee;
      border-left: 4px solid var(--primary-gold);
      border-radius: 10px;
      color: #555;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lista-carreras li:hover {
      transform: translateX(4px);
      border-color: var(--primary-gold);
      background: linear-gradient(90deg, #fffdf7, #ffffff);
    }

    .plan-estudios-grid {
      display: grid;
      gap: 14px;
    }

    .semestre-card {
      background: linear-gradient(135deg, #f9f9f9, #fff);
      border: 1px solid #ebebeb;
      border-radius: 12px;
      padding: 14px 16px;
    }

    .semestre-card strong {
      display: block;
      color: var(--primary-burgundy);
      margin-bottom: 10px;
    }

    .semestre-card ul {
      margin: 0;
      padding-left: 18px;
      color: #555;
      line-height: 1.7;
    }

    @media (max-width: 980px) {
      #mapa-container {
        flex-direction: column;
      }

      #planteles-panel {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      #mapa-svg-wrapper {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="pleca-gobierno"></div>

  <header class="page-header">
    <h1 id="mapa-titulo">Mapa UMB</h1>
  </header>

  <main id="mapa-container">
    <aside id="planteles-panel">
      <div class="planteles-header">Planteles</div>
      <input id="planteles-busca" type="text" placeholder="Buscar plantel o carrera" aria-label="Buscar plantel o carrera" />
      <ul id="planteles-lista"></ul>
    </aside>

    <div id="mapa-svg-wrapper">
      <div class="map-instruction">Selecciona un plantel para ver carreras</div>
      <svg id="mapa-svg" viewBox="0 0 900 620" aria-label="Mapa de planteles UMB">
        <g id="mapa-regiones"></g>
      </svg>
      <div class="zoom-controls">
        <button class="zoom-btn" type="button" id="zoom-in" aria-label="Acercar">+</button>
        <button class="zoom-btn" type="button" id="zoom-out" aria-label="Alejar">−</button>
      </div>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-carrera-overlay" aria-modal="true" role="dialog">
    <div class="modal-content" id="modal-carrera-content"></div>
  </div>

  <script>
    const FALLBACK_CARRERAS = {
      'ingenieria-mecanica': {
        titulo: 'Ingeniería Mecánica',
        duracion: '9 semestres',
        planteles: ['UES Santiago Tianguistenco'],
        objetivo: 'Formar profesionales capaces de diseñar, analizar, operar y mantener sistemas mecánicos y térmicos.',
        perfilIngreso: ['Afinidad por la física y matemáticas', 'Interés por la operación de maquinaria', 'Dibujo técnico'],
        perfilEgreso: ['Diseño y mantenimiento de sistemas mecánicos', 'Optimización de procesos industriales'],
        planEstudios: [
          { semestre: '1er Semestre', materias: ['Cálculo', 'Química', 'Dibujo Mecánico', 'Inglés I'] },
          { semestre: '2do Semestre', materias: ['Estática', 'Termodinámica', 'Programación', 'Inglés II'] }
        ]
      },
      'licenciatura-en-enfermeria': {
        titulo: 'Licenciatura en Enfermería',
        duracion: '10 semestres',
        planteles: ['UES Coatepec Harinas', 'UES El Oro', 'UES Jilotepec'],
        objetivo: 'Formar profesionales con preparación científica, técnica y humanista para la atención integral de la salud.',
        perfilIngreso: ['Interés por el cuidado de la salud', 'Comunicación efectiva', 'Responsabilidad y ética'],
        perfilEgreso: ['Atención integral al paciente', 'Aplicación de protocolos clínicos', 'Colaboración en equipos de salud'],
        planEstudios: [
          { semestre: '1er Semestre', materias: ['Anatomía', 'Bioquímica', 'Fundamentos de Enfermería', 'Inglés I'] },
          { semestre: '2do Semestre', materias: ['Fisiología', 'Microbiología', 'Nutrición', 'Inglés II'] }
        ]
      },
      'licenciatura-en-administracion': {
        titulo: 'Licenciatura en Administración',
        duracion: '9 semestres',
        planteles: ['UES Coatepec Harinas', 'UES Jilotepec'],
        objetivo: 'Desarrollar líderes capaces de administrar recursos, procesos y organizaciones con visión estratégica.',
        perfilIngreso: ['Interés por la gestión y proyectos', 'Capacidad de análisis', 'Trabajo en equipo'],
        perfilEgreso: ['Administración de recursos humanos y financieros', 'Planeación estratégica y mejora continua'],
        planEstudios: [
          { semestre: '1er Semestre', materias: ['Introducción a la Administración', 'Contabilidad', 'Matemáticas', 'Inglés I'] },
          { semestre: '2do Semestre', materias: ['Microeconomía', 'Mercadotecnia', 'Estadística', 'Inglés II'] }
        ]
      }
    };

    const carreras = (window.DB_CARRERAS && Object.keys(window.DB_CARRERAS).length)
      ? window.DB_CARRERAS
      : FALLBACK_CARRERAS;

    const planteles = [
      { id: 'coatepec', nombre: 'UES Coatepec Harinas', carreras: ['licenciatura-en-enfermeria', 'licenciatura-en-administracion'] },
      { id: 'el-oro', nombre: 'UES El Oro', carreras: ['licenciatura-en-enfermeria'] },
      { id: 'jilotepec', nombre: 'UES Jilotepec', carreras: ['licenciatura-en-enfermeria', 'licenciatura-en-administracion'] },
      { id: 'santiago-tianguistenco', nombre: 'UES Santiago Tianguistenco', carreras: ['ingenieria-mecanica'] },
      { id: 'temoaya', nombre: 'UES Temoaya', carreras: ['licenciatura-en-enfermeria'] },
      { id: 'sultepec', nombre: 'UES Sultepec', carreras: ['licenciatura-en-enfermeria'] }
    ];

    const svgGroup = document.getElementById('mapa-regiones');
    const tooltip = document.getElementById('tooltip');
    const busca = document.getElementById('planteles-busca');
    const lista = document.getElementById('planteles-lista');
    const overlay = document.getElementById('modal-carrera-overlay');
    const modalContent = document.getElementById('modal-carrera-content');
    let zoomLevel = 1;
    let selectedPlantelId = null;

    function normalizeText(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function buildRegionPath(id) {
      const variations = {
        'coatepec': 'M 180 90 L 330 60 L 360 140 L 295 195 L 220 170 Z',
        'el-oro': 'M 390 120 L 540 110 L 560 180 L 460 210 L 390 185 Z',
        'jilotepec': 'M 560 90 L 710 80 L 760 150 L 700 210 L 610 200 L 565 150 Z',
        'santiago-tianguistenco': 'M 470 280 L 660 260 L 700 410 L 560 470 L 420 430 Z',
        'temoaya': 'M 150 260 L 290 240 L 330 320 L 220 410 L 100 360 Z',
        'sultepec': 'M 80 160 L 170 125 L 200 205 L 130 270 L 50 230 Z'
      };
      return variations[id] || 'M 100 100 L 200 100 L 200 200 L 100 200 Z';
    }

    function renderMap() {
      svgGroup.innerHTML = '';
      planteles.forEach((plantel) => {
        const region = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const hasCarreras = Array.isArray(plantel.carreras) && plantel.carreras.length > 0;
        region.setAttribute('d', buildRegionPath(plantel.id));
        region.setAttribute('class', 'map-region' + (hasCarreras ? ' has-carreras' : '') + (selectedPlantelId === plantel.id ? ' active' : ''));
        region.dataset.id = plantel.id;

        region.addEventListener('mouseenter', (event) => {
          tooltip.textContent = plantel.nombre;
          tooltip.style.display = 'block';
          const rect = document.getElementById('mapa-svg-wrapper').getBoundingClientRect();
          tooltip.style.left = `${event.clientX - rect.left + 12}px`;
          tooltip.style.top = `${event.clientY - rect.top + 12}px`;
        });

        region.addEventListener('mousemove', (event) => {
          const rect = document.getElementById('mapa-svg-wrapper').getBoundingClientRect();
          tooltip.style.left = `${event.clientX - rect.left + 12}px`;
          tooltip.style.top = `${event.clientY - rect.top + 12}px`;
        });

        region.addEventListener('mouseleave', () => {
          tooltip.style.display = 'none';
        });

        region.addEventListener('click', () => openPlantel(plantel.id));
        svgGroup.appendChild(region);
      });

      document.getElementById('mapa-svg').style.transform = `scale(${zoomLevel})`;
    }

    function renderPlanteles(filter = '') {
      const term = normalizeText(filter);
      const items = planteles.filter((plantel) => {
        const matchesPlantel = normalizeText(plantel.nombre).includes(term);
        const matchesCarrera = plantel.carreras.some((key) => normalizeText(carreras[key]?.titulo || '').includes(term));
        return !term || matchesPlantel || matchesCarrera;
      });

      if (!items.length) {
        lista.innerHTML = '<li class="plantel-item">No se encontraron resultados</li>';
        return;
      }

      lista.innerHTML = items.map((plantel) => `
        <li class="plantel-item ${selectedPlantelId === plantel.id ? 'active' : ''}" data-id="${plantel.id}">
          ${plantel.nombre}
        </li>
      `).join('');

      lista.querySelectorAll('.plantel-item').forEach((item) => {
        item.addEventListener('click', () => openPlantel(item.dataset.id));
      });
    }

    function openPlantel(id) {
      const plantel = planteles.find((item) => item.id === id);
      if (!plantel) return;

      selectedPlantelId = id;
      renderMap();
      renderPlanteles(busca.value);

      const carrerasEnPlantel = plantel.carreras.map((key) => carreras[key]).filter(Boolean);

      if (!carrerasEnPlantel.length) {
        modalContent.innerHTML = `
          <div class="modal-header">
            <button class="close-btn" type="button" aria-label="Cerrar">&times;</button>
            <h2>${plantel.nombre}</h2>
            <div class="modal-subtitle">Sin carreras registradas</div>
          </div>
          <div class="modal-body">
            <div class="carrera-seccion">
              <div class="carrera-subtitulo">Información</div>
              <p class="carrera-texto">Este plantel aún no tiene información de carreras disponible.</p>
            </div>
          </div>
        `;
        overlay.classList.add('open');
        bindClose();
        return;
      }

      modalContent.innerHTML = `
        <div class="modal-header">
          <button class="close-btn" type="button" aria-label="Cerrar">&times;</button>
          <h2>${plantel.nombre}</h2>
          <div class="modal-subtitle">${carrerasEnPlantel.length} carrera${carrerasEnPlantel.length > 1 ? 's' : ''} disponibles</div>
        </div>
        <div class="modal-body">
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Carreras</div>
            <ul class="lista-carreras">
              ${carrerasEnPlantel.map((carrera, index) => `
                <li data-key="${plantel.carreras[index]}">${carrera.titulo}</li>
              `).join('')}
            </ul>
          </div>
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Descripción</div>
            <p class="carrera-texto">Aquí puedes abrir la información de cada carrera disponible en este plantel.</p>
          </div>
        </div>
      `;

      modalContent.querySelectorAll('.lista-carreras li').forEach((item) => {
        item.addEventListener('click', () => openCarreraDetail(item.dataset.key, plantel.nombre));
      });

      overlay.classList.add('open');
      bindClose();
    }

    function openCarreraDetail(key, plantelNombre) {
      const carrera = carreras[key];
      if (!carrera) return;

      const detalles = [];

      if (Array.isArray(carrera.planEstudios) && carrera.planEstudios.length) {
        detalles.push(`
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Plan de estudios</div>
            <div class="plan-estudios-grid">
              ${carrera.planEstudios.map((semestre) => `
                <div class="semestre-card">
                  <strong>${semestre.semestre}</strong>
                  <ul>${(semestre.materias || []).map((materia) => `<li>${materia}</li>`).join('')}</ul>
                </div>
              `).join('')}
            </div>
          </div>
        `);
      }

      if (Array.isArray(carrera.perfilIngreso) && carrera.perfilIngreso.length) {
        detalles.push(`
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Perfil de ingreso</div>
            <ul class="lista-carreras">
              ${carrera.perfilIngreso.map((item) => `<li>${item}</li>`).join('')}
            </ul>
          </div>
        `);
      }

      if (Array.isArray(carrera.perfilEgreso) && carrera.perfilEgreso.length) {
        detalles.push(`
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Perfil de egreso</div>
            <ul class="lista-carreras">
              ${carrera.perfilEgreso.map((item) => `<li>${item}</li>`).join('')}
            </ul>
          </div>
        `);
      }

      modalContent.innerHTML = `
        <div class="modal-header">
          <button class="close-btn" type="button" aria-label="Cerrar">&times;</button>
          <h2>${carrera.titulo}</h2>
          <div class="modal-subtitle">${plantelNombre || (carrera.planteles || []).join(', ')}</div>
        </div>
        <div class="modal-body">
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Objetivo</div>
            <p class="carrera-texto">${carrera.objetivo || 'Sin objetivo registrado.'}</p>
          </div>
          <div class="carrera-seccion">
            <div class="carrera-subtitulo">Información rápida</div>
            <p class="carrera-texto"><strong>Duración:</strong> ${carrera.duracion || 'No especificada'}<br><strong>Planteles:</strong> ${(carrera.planteles || []).join(', ')}</p>
          </div>
          ${detalles.join('')}
        </div>
      `;
      bindClose();
    }

    function bindClose() {
      const btn = modalContent.querySelector('.close-btn');
      if (btn) {
        btn.addEventListener('click', () => overlay.classList.remove('open'));
      }
      overlay.onclick = (event) => {
        if (event.target === overlay) overlay.classList.remove('open');
      };
    }

    document.getElementById('zoom-in').addEventListener('click', () => {
      zoomLevel = Math.min(zoomLevel + 0.1, 1.8);
      renderMap();
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      zoomLevel = Math.max(zoomLevel - 0.1, 0.7);
      renderMap();
    });

    busca.addEventListener('input', (event) => {
      renderPlanteles(event.target.value);
    });

    renderMap();
    renderPlanteles();
  </script>
</body>
</html>
