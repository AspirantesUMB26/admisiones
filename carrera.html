<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Carrera | UMB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <span style="font-weight: 800;">UMB</span>
            <ul class="navbar-links">
                <li><a href="index.html" class="navbar-link">Inicio</a></li>
                <li><a href="#objetivo" class="navbar-link">Objetivo</a></li>
                <li><a href="#plan" class="navbar-link">Plan</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" id="heroSection">
        <div class="hero-content">
            <h1 id="carreraTitulo">Cargando carrera...</h1>
            <p id="carreraEslogan"></p>
        </div>
    </section>

    <div class="container" style="margin-top: 2rem;">
        <div class="content-with-sidebar">
            <div class="main-column">
                <section id="objetivo" class="mb-12">
                    <h2>Objetivo</h2>
                    <div class="card"><p id="carreraObjetivo"></p></div>
                </section>

                <section id="perfil" class="mb-12">
                    <h2>Perfil del Estudiante</h2>
                    <div class="grid grid-2">
                        <div class="card">
                            <h4>Perfil de Ingreso</h4>
                            <ul id="listaIngreso"></ul>
                        </div>
                        <div class="card">
                            <h4>Perfil de Egreso</h4>
                            <ul id="listaEgreso"></ul>
                        </div>
                    </div>
                </section>

                <section id="plan" class="mb-12">
                    <h2>Plan de Estudios</h2>
                    <div class="plan-estudios" id="contenedorPlan"></div>
                </section>
            </div>

            <aside class="sidebar">
                <div class="sidebar-card">
                    <h3>Información Rápida</h3>
                    <p><strong>Duración:</strong> <span id="infoDuracion"></span></p>
                    <p><strong>Planteles:</strong> <span id="infoPlanteles"></span></p>
                </div>
                <div class="sidebar-card">
                    <button onclick="downloadPDF()" class="btn btn-primary">Descargar PDF</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Cargar base de datos y script cargador -->
    <script src="carreras.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Leer el parámetro ?id= de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const carreraId = urlParams.get('id');

            const carrera = DB_CARRERAS[carreraId];

            if (!carrera) {
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Carrera no encontrada. <a href='index.html'>Volver al inicio</a></h2>";
                return;
            }

            // Inyectar la información en el DOM
            document.title = `${carrera.titulo} | UMB`;
            document.getElementById('carreraTitulo').innerText = carrera.titulo;
            document.getElementById('carreraObjetivo').innerText = carrera.objetivo;
            document.getElementById('infoDuracion').innerText = carrera.duracion;
            document.getElementById('infoPlanteles').innerText = carrera.planteles.join(", ");

            // Llenar listas
            const listaIngreso = document.getElementById('listaIngreso');
            carrera.perfilIngreso.forEach(item => {
                let li = document.createElement('li');
                li.innerText = item;
                listaIngreso.appendChild(li);
            });

            const listaEgreso = document.getElementById('listaEgreso');
            carrera.perfilEgreso.forEach(item => {
                let li = document.createElement('li');
                li.innerText = item;
                listaEgreso.appendChild(li);
            });

            // Llenar Plan de Estudios
            const contenedorPlan = document.getElementById('contenedorPlan');
            carrera.planEstudios.forEach(sem => {
                let div = document.createElement('div');
                div.className = 'semestre';
                div.innerHTML = `
                    <div class="semestre-title">${sem.semestre}</div>
                    <ul class="asignaturas-list">
                        ${sem.materias.map(m => `<li class="asignatura">${m}</li>`).join('')}
                    </ul>
                `;
                contenedorPlan.appendChild(div);
            });
        });
    </script>
    <script src="scripts.js"></script>
</body>
</html>
